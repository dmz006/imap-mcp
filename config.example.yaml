# imap-mcp configuration example
# Copy to config.yaml and edit. Never commit config.yaml.
#
# Credential resolution — three ways, in priority order:
#   1. ${ENV_VAR}      → resolved from the environment at startup (standalone)
#   2. ${secret:name}  → fetched from a datawatch secrets service at startup
#                        (requires the `datawatch:` block below — see bottom of file)
#   3. plain value     → used as-is
#
# imap-mcp runs FULLY STANDALONE by default. The datawatch block is optional;
# without it, ${secret:...} references are a startup error and only ${ENV_VAR}
# / plain values are used.

accounts:
  - name: personal
    default: true
    imap:
      host: imap.example.com
      port: 993
      tls: true
    auth:
      type: plain
      username: user@example.com
      # Use ${ENV_VAR} to pull from environment, or put the value directly here.
      # Never commit a config file with real passwords to git.
      password: ${IMAP_MCP_PERSONAL_PASSWORD}
    # ── Outbound (OPTIONAL) ───────────────────────────────────────────────
    # Per-domain SMTP. Sends go through THIS domain's server, not a relay.
    # Credentials default to the auth block above; override if they differ.
    # Omit the whole smtp block to keep the account receive-only.
    smtp:
      host: smtp.example.com
      port: 587          # 587=STARTTLS, 465=implicit TLS
      starttls: true
      from: "Me <user@example.com>"
      # username: user@example.com         # defaults to auth.username
      # password: ${secret:personal_smtp}  # defaults to auth.password
    # ── Cache sync overrides (OPTIONAL) ───────────────────────────────────
    # Replace the global sync.folders list and/or window for this account.
    # sync:
    #   folders: [INBOX, \Sent, \Archive]
    #   window_days: 60
    #   folder_window_days:
    #     \Archive: 365
    # ── Inbound command channel (OPTIONAL, default-deny) ──────────────────
    # Turns this account into a TRUST-GATED control channel: a command in a
    # watched message is acted on ONLY if every required gate passes. Email
    # From: is spoofable, so an allowlist alone is NOT enough — layer gates.
    # Commands use a fenced envelope in the body:
    #   -----BEGIN DATAWATCH COMMAND-----
    #   verb: mail.archive
    #   args: {"from":"noise@example.com"}
    #   nonce: <unique-per-command>
    #   ts: 2026-06-07T20:00:00Z
    #   hmac: <hex hmac-sha256 over the canonical envelope>   # if hmac_secret set
    #   -----END DATAWATCH COMMAND-----
    inbound:
      enabled: false              # opt-in; off by default
      watch_folder: INBOX
      gates:                      # ALL configured gates are required (AND)
        allowlist: [ops@example.com]   # addresses or bare domains
        require_dkim: true        # needs dkim=pass in Authentication-Results
        require_dmarc: true       # needs dmarc=pass
        hmac_secret: ${secret:personal_inbound_hmac}  # shared-secret over envelope
        replay_window_minutes: 10 # reject stale commands; nonces are single-use
        require_pgp: false        # BACKLOG — when true, fails closed until implemented
      capabilities: [status, mail.archive]  # allowed verbs (default-deny)

  # ── Gmail ──────────────────────────────────────────────────────────────────
  # Gmail requires an App Password (NOT your regular Google password).
  # IMAP is always enabled — no toggle needed since January 2025.
  #
  # Setup (5 min):
  #   1. Enable 2-Step Verification: https://myaccount.google.com/security
  #   2. Generate an App Password: https://myaccount.google.com/apppasswords
  #      → Name it "imap-mcp" → copy the 16-char code (no spaces)
  #   3. Paste the code in the password field below (or use ${ENV_VAR})
  #
  # Server settings (fixed — do not change):
  #   host: imap.gmail.com  port: 993  tls: true
  - name: gmail
    imap:
      host: imap.gmail.com
      port: 993
      tls: true
    auth:
      type: plain
      username: user@gmail.com
      # Standalone: from the environment …
      password: ${GMAIL_APP_PASSWORD}
      # datawatch-integrated: … or store the App Password in datawatch's secrets
      # service and reference it (requires the `datawatch:` block at the bottom):
      # password: ${secret:gmail_app_password}

  # ── Enterprise Gmail / Google Workspace (OAuth) ─────────────────────────────
  # For Workspace accounts that require OAuth (App Passwords often disabled).
  # See docs/enterprise-gmail-oauth.md for the full Google Cloud setup.
  #
  # PATH A — 3-legged user consent (one-time browser sign-in):
  #   1. Google Cloud project → OAuth consent screen (User type: Internal)
  #   2. Create an OAuth client (Desktop app), enable scope https://mail.google.com/
  #   3. Fill client_id/client_secret below, then run:
  #        imap-mcp auth-setup --account work-gmail
  # NOTE: provider: google is REQUIRED — a custom domain can't be auto-detected.
  # - name: work-gmail
  #   imap: { host: imap.gmail.com, port: 993, tls: true }
  #   auth:
  #     type: xoauth2
  #     provider: google                       # REQUIRED for Workspace domains
  #     username: you@company.com
  #     client_id: ${GMAIL_OAUTH_CLIENT_ID}
  #     client_secret: ${secret:gmail_oauth_client_secret}
  #     token_file: ~/.config/imap-mcp/work-gmail.token.json
  #
  # PATH B — service account + domain-wide delegation (headless, admin-granted):
  #   Admin authorizes the service account's client ID for scope
  #   https://mail.google.com/ in the Workspace Admin Console. No browser, no
  #   per-user token. imap-mcp impersonates `subject` via the key file.
  # - name: work-gmail-sa
  #   imap: { host: imap.gmail.com, port: 993, tls: true }
  #   auth:
  #     type: xoauth2_service_account
  #     username: you@company.com              # mailbox to access (impersonated)
  #     service_account_file: ~/.config/imap-mcp/gworkspace-sa.json
  #     # subject: you@company.com             # defaults to username

  # ── Outlook / Microsoft 365 ────────────────────────────────────────────────
  # Option A: App Password (same as Gmail — requires MFA enabled on account)
  # Option B: OAuth2 (requires Azure AD app registration)
  - name: work
    imap:
      host: outlook.office365.com
      port: 993
      tls: true
    auth:
      type: plain                       # or: xoauth2
      username: user@corp.example.com
      password: ${IMAP_MCP_WORK_PASSWORD}
      # For xoauth2, replace the above password field with:
      # provider: microsoft
      # client_id: ${IMAP_MCP_WORK_OAUTH_CLIENT_ID}
      # client_secret: ${IMAP_MCP_WORK_OAUTH_CLIENT_SECRET}
      # token_file: ~/.config/imap-mcp/work.token.json

# working_dir: directory where all MCP file output is written.
# This is the ONLY location the server writes files to disk.
# Paths outside this directory are rejected at the server level.
# Default: ~/workspace/email
working_dir: ~/workspace/email

server:
  host: 127.0.0.1
  port: 8765

  # Bearer-token auth for `imap-mcp serve` (REST at /api, MCP at /mcp).
  # REQUIRED: serve refuses to start without at least one token unless
  # `disabled: true` is set. stdio mode and `run-rules` never use this block.
  #
  # Clients send `Authorization: Bearer <token>`. /api/health stays open.
  # Each token gets only the scopes its client needs:
  #   read   accounts, folders, messages, search, analytics, rules listing,
  #          the /api/events stream, reading the output sandbox
  #   write  mailbox changes (move/delete/flags/labels/purge/trash), rules
  #          changes, writing to the output sandbox
  #   send   outbound mail (send_message, POST .../messages/send)
  #   admin  webhooks, /api/query, sync and enrichment triggers
  #
  # Token values must be ${secret:name} (datawatch block below) or ${ENV}
  # references, at least 32 characters. Generate one with:
  #   openssl rand -hex 32
  # An unresolvable reference always stops startup (fails closed), even when
  # auth is disabled. The token name is logged; the value never is.
  auth:
    # Insecure opt-out: accept unauthenticated requests from any local process.
    # Warned at every startup and reported as "auth": "disabled" in /api/health.
    # Env override: IMAP_MCP_SERVER_AUTH_DISABLED=true
    disabled: false
    tokens:
      # Claude Code sessions (~/.mcp.json "headers": {"Authorization": "Bearer ..."}).
      - name: claude
        token: ${IMAP_MCP_TOKEN_CLAUDE}            # or ${secret:imap_mcp_token_claude}
        scopes: [read, write, send, admin]
      # datawatch imap_mcp messaging backend: event stream + replies only.
      - name: datawatch
        token: ${IMAP_MCP_TOKEN_DATAWATCH}         # or ${secret:imap_mcp_token_datawatch}
        scopes: [read, send]

# Two SQLite files (pure-Go driver, no cgo):
#   path        state DB: rules, webhooks, inbound nonces. Not rebuildable — back it up.
#   cache.path  mail cache: messages, full-text index, vectors, sender profiles,
#               knowledge graph, sync state. Disposable: rebuilt from IMAP.
# Upgrading from <0.6.0 splits a single-file imap.db automatically: it is backed
# up first (imap.db.bak-<timestamp>-pre-0.6.0), the state tables are verified
# unchanged, and the cache tables are dropped (cache.db is rebuilt from IMAP).
#
# Optional at-rest encryption, per file (whole-file, adiantum + Argon2id).
# Keys must be ${secret:name} or ${ENV} passphrase references. A key is never
# generated: a missing, unresolvable or wrong key refuses to open the file.
# run-rules only opens the state DB, so it needs only db.encryption_key.
# Env overrides: IMAP_MCP_DB_PATH, IMAP_MCP_DB_ENCRYPTION_KEY,
#                IMAP_MCP_DB_CACHE_PATH, IMAP_MCP_DB_CACHE_ENCRYPTION_KEY.
# Encryption state is reported in /api/health under "storage".
# To encrypt an existing plaintext file, set its key, stop the service, then run
#   imap-mcp db encrypt [--only state|cache] --config PATH
# It verifies the encrypted copy before replacing the plaintext original, and
# lists other plaintext copies (e.g. the pre-0.6.0 backup) for you to delete.
# The server never converts a file on its own: a key on a plaintext file
# refuses to start.
db:
  path: ~/.local/share/imap-mcp/imap.db
  # encryption_key: ${secret:imap_mcp_state_key}
  cache:
    path: ~/.local/share/imap-mcp/cache.db   # default: cache.db next to path
    # encryption_key: ${secret:imap_mcp_cache_key}

# Background enrichment of cached mail: embeddings (semantic search) and
# hall/wing/room classification. Queue lanes: NEW mail (arrived since the last
# sync) is always served before BACKFILL (first sync, window growth); only
# backfill is ever rate-limited, windowed or paused for other GPU work.
# Queue depth, throughput, lag and pause/backoff state: /api/health
# "enrichment", the enrichment_status tool, GET /api/enrichment/status.
enrichment:
  enabled: true
  ollama_url: http://localhost:11434   # default URL for both providers below
  embed_model: nomic-embed-text        # default embed.model
  llm_model: qwen3:1.7b                # default classify.model
  batch_size: 20
  auto_sync: true
  # Embeddings always go straight to an Ollama (any node's URL).
  # embed:
  #   url: http://localhost:11434
  #   model: nomic-embed-text
  # Classification: provider "ollama" (direct, default) or "datawatch" (POST
  # /api/proxy/llm/<datawatch_llm> via the datawatch block's api_url + token;
  # the token needs the sessions:input capability) for registry routing and
  # node failover.
  # classify:
  #   provider: ollama
  #   url: http://localhost:11434
  #   model: qwen3:1.7b
  #   datawatch_llm: fast-small
  concurrency: 2              # max in-flight calls per provider
  backfill_per_minute: 30     # backfill rate limit (0 = unlimited); new mail is never limited
  max_attempts: 3             # then the message is marked error (see cache_sweep errors_only)
  backoff_max_seconds: 300    # exponential backoff cap after transient provider errors (5xx, 429, network)
  # Optional local-time window for backfill ("quiet hours"), may wrap midnight.
  # Empty = backfill any time. New mail is always enriched immediately.
  backfill_window: ""         # e.g. "22:00-07:00"
  # Pause BACKFILL (never new mail) while the GPU is busy with other work:
  #  - models other than ours resident on the embed Ollama above the threshold
  #  - any listed datawatch capacity pool full or with waiters (needs the
  #    datawatch block; token needs autonomous:read). With classify provider
  #    datawatch, "llm:<datawatch_llm>" is watched automatically.
  # Unreachable sources never block (degrades to the caps above).
  yield:
    enabled: true
    max_foreign_resident_gb: 8
    # datawatch_pools: ["node:my-gpu-node"]
  # Env overrides: IMAP_MCP_ENRICHMENT_CONCURRENCY, _BACKFILL_PER_MINUTE,
  # _MAX_ATTEMPTS, _BACKOFF_MAX_SECONDS, _BACKFILL_WINDOW, _CLASSIFY_PROVIDER,
  # _YIELD (all prefixed IMAP_MCP_ENRICHMENT_), IMAP_MCP_OLLAMA_URL.

# Background mail cache (cache.db). Read-only against the server: folders are
# EXAMINEd and bodies fetched with BODY.PEEK, so no flag (not even \Seen) changes.
# Each cycle: UID SEARCH SINCE <window> by INTERNALDATE; new mail is fetched
# newest-first; mail that left the window (or was expunged/moved) is removed from
# the CACHE ONLY; flags refresh via CONDSTORE CHANGEDSINCE where the server
# supports it. A UIDVALIDITY change rebuilds that folder.
# Env overrides: IMAP_MCP_SYNC_INTERVAL_MINUTES, IMAP_MCP_SYNC_WINDOW_DAYS,
#                IMAP_MCP_SYNC_MAX_MESSAGE_MB. Settings appear in /api/health.
sync:
  interval_minutes: 15
  full_sync_on_start: true
  # SPECIAL-USE tokens (\Sent, \Archive, \Drafts, \Junk, \All, \Flagged) or
  # literal names. Tokens resolve per server (e.g. Gmail \Sent = "[Gmail]/Sent Mail").
  # \All caches every message (copies are enrichment-deduplicated by Message-ID).
  folders:
    - INBOX
    - \Sent
  # Rolling window in days, by IMAP INTERNALDATE (server arrival time).
  # Shrinking it purges the cache on the next cycle; growing it backfills.
  window_days: 30
  # Per-folder overrides (key = the entry as written in folders):
  # folder_window_days:
  #   \Sent: 90
  # Messages larger than this are cached headers-only (no body).
  max_message_mb: 25
  # Cleaning (cache only — the mailbox is never touched). After every cycle:
  # folders/accounts no longer configured are dropped from the cache, orphaned
  # vectors/queue rows removed, the full-text index verified (rebuilt if
  # inconsistent) and the WAL checkpointed. On demand: the cache_sweep tool /
  # POST /api/cache/sweep (admin scope; dry_run defaults to true).
  # Keep \Flagged messages cached (and fetch them) even outside the window.
  keep_flagged: false
  # VACUUM the cache file at most this often (hours; 0 = never automatically).
  vacuum_interval_hours: 24
  # Env overrides: IMAP_MCP_SYNC_KEEP_FLAGGED, IMAP_MCP_SYNC_VACUUM_INTERVAL_HOURS.

log:
  level: info
  format: text

# ── datawatch integration (OPTIONAL) ─────────────────────────────────────────
# Uncomment to resolve ${secret:name} credential references against a datawatch
# secrets service. Leave commented out to run fully standalone.
#
# SECURITY: never put a literal token here. Always use an ${ENV_VAR} reference so
# no secret is ever written into a config file or committed to a repo.
#
#   export DATAWATCH_API_URL=https://127.0.0.1:8443
#   export IMAP_MCP_DATAWATCH_TOKEN=<imap-mcp service token>
#
# Mint the service token yourself in a terminal (datawatch v8.75.0+):
#   datawatch secrets mint-service-token imap-mcp
# and set every secret imap-mcp reads with --scope service:imap-mcp.
# Secrets resolve via GET {api_url}/api/external/secrets/{name}.
#
# datawatch:
#   api_url: ${DATAWATCH_API_URL}
#   token: ${IMAP_MCP_DATAWATCH_TOKEN}
#   # datawatch serves HTTPS with a self-signed certificate by default. Pin it;
#   # TLS verification is never disabled. A missing/invalid file fails startup.
#   ca_file: ~/.datawatch/tls/server/cert.pem
