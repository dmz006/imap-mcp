  - id: code-scanning/7
    kind: code
    package: "go/log-injection"
    version: "internal/service/replies.go:384"
    severity: medium
    impact:
      traced: true
      reachable: "no"
      analysis: "imap-mcp logs only through log/slog with its Text or JSON handler (cmd/imap-mcp/main.go). Both quote or escape CR, LF and other control characters in attribute values, so a value from mail or a request cannot start a new log line or forge an entry."
      method: "Read the logging setup (slog.NewTextHandler / slog.NewJSONHandler are the only handlers) and the flagged call: the value is passed as a slog attribute, never formatted into the message string."
    first_added: "2026-10-11"
    added: "2026-10-11"
    expires: "2027-01-09"
    validated_by: "claude-session"
