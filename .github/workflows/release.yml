# Release (AGENT.md D69): on an exact vX.Y.Z tag, run the tests and the
# security gates again, then build with GoReleaser, sign the checksums
# keylessly (cosign), attach an SBOM per archive (syft) and attest build
# provenance. Notes are that version's CHANGELOG.md section. Run it by hand
# (workflow_dispatch) to re-publish an existing tag.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.1"
        required: true

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: the tag matches the version
        run: |
          got=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/config/config.go)
          [ "$got" = "${TAG#v}" ] || { echo "config.Version is $got but the tag is $TAG" >&2; exit 1; }
      - name: CHANGELOG has a section for the tag
        run: scripts/release-notes.sh "$TAG" > /dev/null
      - name: go mod tidy changes nothing
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: test
        run: go test -race -count=1 ./...
      - name: govulncheck against security/accepted-risks.yml
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... > govulncheck.json
          python3 scripts/vuln_gate.py govulncheck.json
      - name: lint and gosec
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: accepted-risks schema
        run: python3 scripts/check_accepted_risks.py

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # create the release and upload assets
      id-token: write     # keyless cosign signing and provenance
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: release notes
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
