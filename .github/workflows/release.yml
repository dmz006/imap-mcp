# Release: on a v* tag, test, build binaries and publish a GitHub release whose
# notes are that version's CHANGELOG.md section. Run it by hand
# (workflow_dispatch) to publish a release for a tag pushed earlier.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.15.4"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The notes script and CHANGELOG come from the default branch, so a tag
      # pushed before this workflow existed can still be released.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .release-tools

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the tag matches the version
        run: |
          want="${TAG#v}"
          got=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/config/config.go)
          if [ "$got" != "$want" ]; then
            echo "config.Version is $got but the tag is $TAG" >&2
            exit 1
          fi

      - name: Release notes
        run: .release-tools/scripts/release-notes.sh "$TAG" > notes.md

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="imap-mcp_${TAG#v}_${os}_${arch}"
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "dist/$name/imap-mcp" ./cmd/imap-mcp
            cp README.md LICENSE CHANGELOG.md "dist/$name/" 2>/dev/null || true
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -r "dist/$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md
          fi
